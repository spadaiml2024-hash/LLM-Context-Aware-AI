<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>AI Resume Analyzer</h1>
        <p>Analyze your resume and discover suitable job roles</p>
    </header>

    <main>
        <section class="container">

            <h2>Resume Analysis</h2>

            <form action="/analyze" method="POST">

                <label for="resume_text">
                    Enter your resume details
                </label>

                <textarea
                    id="resume_text"
                    name="resume_text"
                    placeholder="Paste your resume content here..."
                    required
                ></textarea>

                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </section>
    </main>

    <footer>
        <p>AI Resume Analyzer & Job Role Recommender</p>
    </footer>

</body>
</html>
